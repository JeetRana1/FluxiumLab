name: Deploy to Pi (Production)

on:
  workflow_run:
    workflows: ["Node.js CI"]
    types:
      - completed
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: [self-hosted, production-deploy, api-consumet-only]
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    env:
      ACTIONS_RUNNER_DEBUG: false
      ACTIONS_STEP_DEBUG: false

    steps:
      - name: Validate workflow execution
        run: |
           if [[ "${{ github.repository }}" != "JeetRana1/FluxiumLab" ]]; then
            echo "ERROR: Unauthorized repository: ${{ github.repository }}"
            exit 1
          fi
          if [[ "${{ github.ref }}" != "refs/heads/main" ]] && [[ "${{ github.ref }}" != "refs/heads/master" ]] && [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "ERROR: Unauthorized branch: ${{ github.ref }}"
            exit 1
          fi
          echo "Workflow validation passed"

      - name: Mask sensitive paths
        run: |
          echo "::add-mask::$HOME"
          echo "::add-mask::$USER"
          echo "::add-mask::$(pwd)"
          echo "::add-mask::$(dirname $HOME)"
          echo "::add-mask::${GITHUB_WORKSPACE}"
          # Mask runner directory if it exists
          if [ -d "$HOME/actions-runner" ]; then
            echo "::add-mask::$HOME/actions-runner"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4.0.2
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: |
          yarn install --silent 2>&1 | grep -v "^warning" || true
          yarn upgrade --silent 2>&1 | grep -v "^warning" || true

      - name: Build API
        run: yarn build --silent 2>&1 | tail -5 || true

      - name: Restart PM2 process
        run: |
          # Remove the legacy process and any duplicate app entries before
          # ensuring the single canonical ecosystem process is running.
          pm2 delete consumet --silent || true
          pm2 delete consumet-api-preview --silent || true
          if pm2 describe consumet-api > /dev/null 2>&1; then
            pm2 restart consumet-api --update-env --silent
          else
            pm2 start ecosystem.config.js --only consumet-api --update-env --silent
          fi
          pm2 save --silent
          echo "PM2 process restarted successfully"

       - name: Check PM2 status
         run: |
           pm2 status 2>&1 | grep -E "(id|name|status|cpu|memory)" | head -3
           echo "Deployment completed"

       - name: Check local API health
         run: |
           for attempt in {1..12}; do
             if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/dev/null; then
               echo "API health check passed"
               exit 0
             fi
             sleep 2
           done
           echo "API health check failed"
           pm2 logs consumet-api --lines 80 --nostream || true
           exit 1
